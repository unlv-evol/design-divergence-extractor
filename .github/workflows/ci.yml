name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make dev
      - run: git config --global init.defaultBranch main
      # Includes the R1 (no SALP) and R3 (no outcome input) tests in tests/unit/test_requirements.py.
      - run: make check
