[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dde"
version = "0.2.0"
description = "Design-Divergence Extractor (dde) and its data-preparation companion (dde-prep), for the Beyond Refactorings study."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "UNLV EVOL" }]
# R6: the only runtime dependencies. Exact versions are pinned in requirements.lock.
dependencies = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java>=0.23,<0.24",
]

[project.optional-dependencies]
# dde-prep only: the pilot workbooks. dde itself never needs it.
prep = ["openpyxl>=3.1,<4"]
dev = ["openpyxl>=3.1,<4", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
dde = "dde.cli:main"
dde-prep = "dde_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: builds git repositories in a temp dir (needs git, no network)",
    "refactoringminer: runs the real RefactoringMiner; skipped unless DDE_REFACTORINGMINER is set",
]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["dde", "dde_prep"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["dde", "dde_prep"]
branch = true

[tool.ruff.lint.per-file-ignores]
# long user-facing strings (sheet legends, report lines)
"src/dde_prep/pilot/*.py" = ["E501"]
